[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptor-django"
version = "0.1.0"
description = "Local-first encrypted notebook migrated from Cryptor App."
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<6.1",
  "ollama>=0.2.0",
  "pycryptodome>=3.18.0",
]

[tool.setuptools.packages.find]
include = ["cryptor_web*", "vault*"]

[tool.setuptools.package-data]
vault = ["templates/**/*.html", "static/**/*"]

